name: wf-ci-development

on:
  pull_request:
    branches:
      - develop

jobs:
  ci-development:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Lint HTML and CSS
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Build project with Parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "/"
